<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#000000">
<title>VELORA-Boy — Find Your Match</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#ff2e63; --primary-dark:#c70039; --gold:#facc15; --gold-light:#fef08a;
  --bg:#000000; --bg2:#111111; --bg3:#222222; --border:#333333;
  --text:#ffffff; --muted:#aaaaaa; --success:#00b894; --online:#25d366;
}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.5;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));overflow-x:hidden}

/* LOADER */
.loader{position:fixed;inset:0;background:var(--bg);z-index:9999;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.spinner{width:44px;height:44px;border:4px solid var(--bg3);border-top-color:var(--gold);
  border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader p{color:var(--muted);font-size:13px}

/* TOP NAV */
.topnav{position:sticky;top:0;z-index:50;background:var(--bg);
  padding:15px 20px 10px;display:flex;align-items:center;justify-content:space-between;
  padding-top:calc(15px + env(safe-area-inset-top))}
.topnav .logo{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
.topnav .logo span{color:var(--primary);font-family:cursive}
.topnav .logo-v{color:var(--gold);border:2px solid var(--gold);border-radius:8px;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-style:italic;font-size:20px}

/* SEARCH BAR (Always Visible) */
.search-wrapper{padding:0 20px 10px;position:relative;z-index:40}
.search-box{display:flex;align-items:center;background:var(--bg2);
  border:1.5px solid var(--border);border-radius:12px;padding:0 15px;transition:.2s}
.search-box:focus-within{border-color:var(--gold);box-shadow:0 0 10px rgba(250,204,21,.15)}
.search-icon{font-size:16px;color:var(--muted)}
.search-box input{flex:1;background:transparent;border:none;color:#fff;
  padding:14px 10px;font-size:15px;font-family:inherit}
.search-box input:focus{outline:none}
.clear-btn{background:none;border:none;color:var(--muted);font-size:18px;
  cursor:pointer;padding:5px}

/* AUTOCOMPLETE DROPDOWN */
.suggestions{position:absolute;top:100%;left:20px;right:20px;background:var(--bg2);
  border:1px solid var(--border);border-radius:12px;margin-top:5px;max-height:200px;
  overflow-y:auto;display:none;box-shadow:0 10px 25px rgba(0,0,0,.6);z-index:50}
.suggestions.active{display:block}
.suggestion-item{padding:12px 16px;font-size:14px;color:#fff;cursor:pointer;
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.suggestion-item:last-child{border-bottom:none}
.suggestion-item:hover,.suggestion-item:active{background:var(--bg3);color:var(--gold)}

/* FILTERS */
.filter-container{padding:0 20px 15px}
.filter-bar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.chip{padding:6px 14px;background:var(--bg2);border:1px solid var(--border);color:var(--muted);
  border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.2s}
.chip.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}

/* HERO BANNER */
.hero-banner{margin:0 20px;border-radius:20px;height:200px;position:relative;
  background:url('https://plus.unsplash.com/premium_photo-1726862576204-840821ed179a?q=80&w=2670&auto=format&fit=crop') center/cover;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);overflow:hidden}
.hero-banner::before{content:'';position:absolute;inset:0;
  background:linear-gradient(to right, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 50%, transparent 100%)}
.hero-content{position:relative;z-index:2;padding:20px;height:100%;
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.hero-content h2{font-size:24px;line-height:1.1;margin:0 0 6px;font-weight:800;color:#fff}
.hero-content p{font-size:12px;color:#ccc;margin:0 0 12px;line-height:1.4}
.btn-get-started{background:var(--gold);color:#000;border:none;padding:8px 16px;
  border-radius:30px;font-weight:700;font-size:13px;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:.2s}
.btn-get-started:active{transform:scale(.95)}

/* POPULAR PROFILES - 3 COLUMN GRID */
.section-header{display:flex;justify-content:space-between;align-items:center;
  padding:20px 20px 15px;margin-top:10px}
.section-header h3{margin:0;font-size:18px;font-weight:700;color:#fff}
.section-header span{font-size:13px;color:var(--gold);cursor:pointer;font-weight:600}
.section-header span:active{opacity:.7}

.profile-scroll{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;
  padding:0 15px 20px}

.profile-card{border-radius:12px;overflow:hidden;background:var(--bg2);
  cursor:pointer;position:relative;border:1px solid var(--border);transition:.2s;width:100%}
.profile-card:active{transform:scale(.97)}
.profile-card .img-wrap{position:relative;height:130px;width:100%}
.profile-card img{width:100%;height:100%;object-fit:cover}
.profile-card .no-photo{width:100%;height:100%;display:flex;align-items:center;
  justify-content:center;font-size:32px;color:#444;background:#222}
.profile-card .heart-btn{position:absolute;bottom:5px;right:5px;
  background:var(--primary);color:#fff;border:none;width:22px;height:22px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:10px;cursor:pointer;padding:0}
.profile-card .card-info{padding:6px 8px;background:var(--bg2)}
.profile-card .card-info h4{margin:0 0 2px;font-size:12px;font-weight:600;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-card .card-info p{margin:0;font-size:10px;color:var(--muted);
  display:flex;align-items:center;gap:3px}
.profile-card .card-info p .dot{width:5px;height:5px;background:var(--online);border-radius:50%}

/* SEARCH LOADING ANIMATION */
.search-loading{grid-column:1 / -1;text-align:center;padding:50px 20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.search-loading .spinner{width:40px;height:40px;border:3px solid var(--bg3);
  border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}
.search-loading h4{color:var(--gold);font-weight:700;font-size:16px;margin-bottom:4px}
.search-loading p{color:var(--muted);font-size:13px}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;
  display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;
  color:#666;font-size:11px;cursor:pointer;text-decoration:none}
.nav-item.active{color:var(--gold)}
.nav-item .icon{font-size:24px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;
  display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex}
.modal{background:var(--bg2);width:100%;max-width:480px;border-radius:20px 20px 0 0;
  padding:24px 20px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;
  animation:slideUp .3s ease;border-top:2px solid var(--gold)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal h3{font-size:18px;margin-bottom:16px;color:var(--gold)}

.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input,textarea{width:100%;padding:13px 16px;background:#000;border:1.5px solid var(--border);
  color:#fff;border-radius:10px;font-size:15px;font-family:inherit;transition:.2s}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{resize:vertical;min-height:70px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border:none;border-radius:10px;cursor:pointer;
  font-size:15px;font-weight:700;transition:all .2s;width:100%;font-family:inherit;color:#fff}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:var(--gold);color:#000;box-shadow:0 4px 15px rgba(250,204,21,.3)}
.btn-ghost{background:var(--bg3);color:#fff}
.btn-lg{padding:15px 24px;font-size:16px}

.modal-profile-head{text-align:center;margin-bottom:16px}
.modal-avatar{width:90px;height:90px;border-radius:50%;margin:0 auto 12px;
  background:var(--bg3);display:flex;align-items:center;justify-content:center;
  font-size:40px;border:3px solid var(--gold);overflow:hidden;position:relative}
.modal-avatar img{width:100%;height:100%;object-fit:cover}
.modal-avatar .online-dot{width:16px;height:16px;bottom:3px;right:3px;
  position:absolute;background:var(--online);border-radius:50%;border:2.5px solid var(--bg2)}
.modal-name{display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:18px;font-weight:800;margin-bottom:4px;flex-wrap:wrap;color:#fff}
.modal-rate{color:var(--gold);font-weight:800;font-size:18px}
.modal-rating-line{color:var(--gold);font-weight:700;font-size:14px;margin-top:6px}
.modal-meta{color:var(--muted);font-size:13px;margin-top:4px}

.reviews-section{margin:16px 0}
.reviews-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.reviews-header strong{font-size:14px;color:var(--gold)}
.reviews-avg{color:var(--gold);font-weight:800;font-size:13px}
.review-item{background:#000;padding:10px 12px;border-radius:8px;margin-bottom:8px;border:1px solid var(--border)}
.review-item .review-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.review-item .review-name{font-size:12px;font-weight:600;color:#fff}
.review-item .review-stars{color:var(--gold);font-size:12px}
.review-item .review-text{font-size:12px;color:var(--muted);line-height:1.4}
.review-item .review-date{font-size:10px;color:#555;margin-top:5px}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:var(--bg3);color:#fff;padding:13px 24px;border-radius:30px;
  font-size:14px;font-weight:500;z-index:9999;max-width:90vw;text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.6);animation:toastIn .3s;border:1px solid var(--border)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.toast.success{border-color:var(--success)}
.toast.error{border-color:var(--primary)}

.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;width:100%;
  grid-column:1 / -1}
.empty .big{font-size:48px;display:block;margin-bottom:12px;opacity:.5}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <p>Loading VELORA-Boy...</p>
</div>

<!-- TOP NAV -->
<div class="topnav">
  <div class="logo">
    <div class="logo-v">V</div> VELORA-<span>Boy</span>
  </div>
</div>

<!-- SEARCH BAR (Permanently Visible) -->
<div class="search-wrapper">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search by city or name..." autocomplete="off" 
           oninput="handleSearchInput(this.value)" onfocus="if(this.value) showSuggestions(this.value)">
    <button class="clear-btn" id="clearSearchBtn" onclick="clearSearch()" style="display:none">✕</button>
  </div>
  <div class="suggestions" id="citySuggestions"></div>
</div>

<!-- FILTERS -->
<div class="filter-container" id="filterContainer">
  <div class="filter-bar">
    <button class="chip active" data-sort="newest" onclick="setSort(this,'newest')">🆕 Newest</button>
    <button class="chip" data-sort="rate-low" onclick="setSort(this,'rate-low')">💰 Rate ↑</button>
    <button class="chip" data-sort="rate-high" onclick="setSort(this,'rate-high')">💎 Rate ↓</button>
    <button class="chip" data-sort="rating" onclick="setSort(this,'rating')">⭐ Top Rated</button>
    <button class="chip" data-sort="online" onclick="setSort(this,'online')">🟢 Online</button>
    <button class="chip" data-sort="near-me" onclick="setSort(this,'near-me')">📍 Near Me</button>
  </div>
</div>

<!-- HERO BANNER -->
<div class="hero-banner">
  <div class="hero-content">
    <h2>Find Your<br>Perfect Match</h2>
    <p>Premium Companionship<br>Just a Tap Away</p>
    <button class="btn-get-started" onclick="scrollToProfiles()">
      Get Started <span style="font-size:16px">→</span>
    </button>
  </div>
</div>

<!-- POPULAR PROFILES -->
<div class="section-header" id="popularProfiles">
  <h3>Popular Profiles</h3>
  <span onclick="toggleSeeAll()" id="seeAllBtn">See All →</span>
</div>

<div class="profile-scroll" id="list"></div>

<!-- BOTTOM NAV -->
<div class="bottom-nav" id="nav"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, push, set, onValue }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDeXdYVYPzysn55sMNkj-tXYZJzBv7VFD4",
  authDomain: "bigwin-29967.firebaseapp.com",
  databaseURL: "https://bigwin-29967-default-rtdb.firebaseio.com",
  projectId: "bigwin-29967",
  storageBucket: "bigwin-29967.firebasestorage.app",
  messagingSenderId: "628333876092",
  appId: "1:628333876092:web:8e36daac959c0f42154af9",
  measurementId: "G-654JHXWMEL"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let me = null;
let allUsers = {};
let allPresence = {};
let allReviews = {};
let usersUnsub = null;
let presenceUnsub = null;
let reviewsUnsub = null;
let sortMode = 'newest';
let searchQuery = '';
let showAll = false;
let nearMeCity = null;

// Search variables
let allCities = new Set();
let searchTimeout;
let isSearching = false;

function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}
window.toast = toast;

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function avatarHTML(user) {
  if (user.photo) return `<img src="${user.photo}">`;
  return '👨';
}

function formatLastSeen(ts) {
  if (!ts) return 'Offline';
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return 'Offline';
}

window.logout = function() {
  if (!confirm('Logout?')) return;
  localStorage.removeItem('currentUser');
  localStorage.clear();
  sessionStorage.clear();
  window.location.replace('index.html?logout=1');
};

window.scrollToProfiles = function() {
  document.getElementById('popularProfiles').scrollIntoView({ behavior: 'smooth' });
};

window.closeModal = function() { document.getElementById('modal').classList.remove('active'); };

function setupNav() {
  document.getElementById('nav').innerHTML = `
    <a class="nav-item active" onclick="location.href='home.html'">
      <span class="icon">🏠</span><span>Home</span></a>
    <a class="nav-item" onclick="location.href='chat.html'">
      <span class="icon">💬</span><span>Chat</span></a>
    <a class="nav-item" onclick="location.href='bookings.html'">
      <span class="icon">📋</span><span>My Bookings</span></a>
    <a class="nav-item" onclick="location.href='support.html'">
      <span class="icon">🛟</span><span>Support</span></a>
  `;
}

function startRealtimeListeners() {
  if (usersUnsub) usersUnsub();
  usersUnsub = onValue(ref(db, 'users'), snap => {
    allUsers = snap.exists() ? snap.val() : {};
    
    // Update unique cities for autocomplete
    allCities.clear();
    Object.values(allUsers).forEach(u => {
      if (u.role === 'playboy' && u.status === 'active' && u.kycDone && u.city) {
        allCities.add(u.city.trim());
      }
    });

    if (!isSearching) renderList();
  });

  if (presenceUnsub) presenceUnsub();
  presenceUnsub = onValue(ref(db, 'presence'), snap => {
    allPresence = snap.exists() ? snap.val() : {};
    if (!isSearching) renderList();
  });

  if (reviewsUnsub) reviewsUnsub();
  reviewsUnsub = onValue(ref(db, 'reviews'), snap => {
    allReviews = snap.exists() ? snap.val() : {};
    if (!isSearching) renderList();
  });
}

/* ============================================================
   SEARCH & AUTOCOMPLETE LOGIC
   ============================================================ */
window.handleSearchInput = function(val) {
  const clearBtn = document.getElementById('clearSearchBtn');
  if (clearBtn) clearBtn.style.display = val.length > 0 ? 'block' : 'none';

  // Show suggestions
  if (val.length > 0) {
    showSuggestions(val);
  } else {
    hideSuggestions();
  }

  // Debounce search (wait 800ms after user stops typing)
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    searchQuery = val.trim().toLowerCase();
    hideSuggestions();
    
    if (searchQuery) {
      triggerSearchEffect(searchQuery);
    } else {
      renderList(); // Reset if empty
    }
  }, 800);
};

function showSuggestions(val) {
  const box = document.getElementById('citySuggestions');
  const query = val.toLowerCase();
  const matches = Array.from(allCities).filter(c => c.toLowerCase().includes(query)).slice(0, 5);
  
  if (matches.length > 0) {
    box.innerHTML = matches.map(c => `
      <div class="suggestion-item" onclick="selectCity('${c.replace(/'/g, "\\'")}')">
        <span>📍</span> ${escapeHtml(c)}
      </div>
    `).join('');
    box.classList.add('active');
  } else {
    hideSuggestions();
  }
}

window.selectCity = function(city) {
  document.getElementById('searchInput').value = city;
  document.getElementById('clearSearchBtn').style.display = 'block';
  hideSuggestions();
  searchQuery = city.toLowerCase();
  triggerSearchEffect(city);
};

function hideSuggestions() {
  document.getElementById('citySuggestions').classList.remove('active');
}

window.clearSearch = function() {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearSearchBtn').style.display = 'none';
  searchQuery = '';
  hideSuggestions();
  renderList();
};

function triggerSearchEffect(query) {
  isSearching = true;
  const box = document.getElementById('list');
  
  // Show "Searching..." popup animation
  box.innerHTML = `
    <div class="search-loading">
      <div class="spinner"></div>
      <h4>Searching...</h4>
      <p>Finding perfect matches in "${escapeHtml(query)}"</p>
    </div>
  `;
  
  // After 1 second, show results
  setTimeout(() => {
    isSearching = false;
    renderList();
  }, 1000); 
}

window.setSort = function(btn, mode) {
  if (mode === 'near-me') {
    if (nearMeCity) {
      nearMeCity = null;
      btn.classList.remove('active');
      toast('Location filter removed', 'success');
      renderList();
    } else {
      enableNearMe(btn);
    }
    return;
  }

  document.querySelectorAll('.chip').forEach(c => {
    if (c.dataset.sort !== 'near-me') c.classList.remove('active');
  });
  btn.classList.add('active');
  sortMode = mode;
  renderList();
};

async function enableNearMe(btn) {
  if (!navigator.geolocation) return toast('Location not supported', 'error');
  toast('📍 Getting your location...');

  navigator.geolocation.getCurrentPosition(async (pos) => {
    try {
      const { latitude, longitude } = pos.coords;
      const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`);
      const data = await res.json();
      const city = data.city || data.locality || data.principalSubdivision;

      if (!city) return toast('Could not detect your city', 'error');

      nearMeCity = city.toLowerCase();
      document.getElementById('searchInput').value = city;
      document.getElementById('clearSearchBtn').style.display = 'block';
      btn.classList.add('active');
      toast(`📍 Showing profiles near ${city}`, 'success');
      triggerSearchEffect(city);
    } catch (e) {
      toast('Location detection failed', 'error');
    }
  }, (err) => {
    toast('Location permission denied', 'error');
  }, { enableHighAccuracy: true, timeout: 10000 });
}

window.toggleSeeAll = function() {
  showAll = !showAll;
  renderList();
};

/* ============================================================
   RENDER LIST
   ============================================================ */
function renderList() {
  const box = document.getElementById('list');
  if (!me) return;

  let list = Object.values(allUsers).filter(u =>
    u.role === 'playboy' && u.status === 'active' && u.kycDone
  );

  // Location filter
  if (nearMeCity) {
    list = list.filter(p => (p.city || '').toLowerCase().includes(nearMeCity));
  }

  // Search filter
  if (searchQuery) {
    list = list.filter(p =>
      (p.name || '').toLowerCase().includes(searchQuery) ||
      (p.city || '').toLowerCase().includes(searchQuery) ||
      (p.bio || '').toLowerCase().includes(searchQuery)
    );
  }

  // Sort
  list.sort((a, b) => {
    if (sortMode === 'rate-low') return (a.rate || 0) - (b.rate || 0);
    if (sortMode === 'rate-high') return (b.rate || 0) - (a.rate || 0);
    if (sortMode === 'rating') return (b.avgRating || 0) - (a.avgRating || 0);
    if (sortMode === 'online') {
      const aOn = allPresence[a.uid]?.online ? 1 : 0;
      const bOn = allPresence[b.uid]?.online ? 1 : 0;
      if (aOn !== bOn) return bOn - aOn;
      return (b.createdAt || 0) - (a.createdAt || 0);
    }
    return (b.createdAt || 0) - (a.createdAt || 0);
  });

  // See All limit
  const totalCount = list.length;
  const hasFilter = !!searchQuery || !!nearMeCity;
  const displayLimit = 6;

  if (!showAll && !hasFilter && totalCount > displayLimit) {
    list = list.slice(0, displayLimit);
  }

  // Update See All button
  const seeAllBtn = document.getElementById('seeAllBtn');
  if (seeAllBtn) {
    if (hasFilter || totalCount <= displayLimit) {
      seeAllBtn.style.display = 'none';
    } else {
      seeAllBtn.style.display = 'inline';
      seeAllBtn.textContent = showAll ? 'Show Less ↑' : `See All (${totalCount}) →`;
    }
  }

  if (!list.length) {
    let msg = 'No profiles found';
    if (nearMeCity) msg = `No profiles in "${nearMeCity}"`;
    if (searchQuery) msg = `No results for "${searchQuery}"`;
    box.innerHTML = `<div class="empty"><span class="big">🔍</span>${msg}</div>`;
    return;
  }

  box.innerHTML = list.map(p => {
    const isOnline = allPresence[p.uid]?.online === true;
    return `<div class="profile-card" onclick="openCard('${p.uid}')">
      <div class="img-wrap">
        ${p.photo ? `<img src="${p.photo}">` : `<div class="no-photo">👨</div>`}
        <button class="heart-btn" onclick="event.stopPropagation()">❤️</button>
      </div>
      <div class="card-info">
        <h4>${escapeHtml(p.name)}</h4>
        <p>${isOnline ? '<span class="dot"></span> Online' : 'Offline'}</p>
      </div>
    </div>`;
  }).join('');
}

window.openCard = async function(uid) {
  const snap = await get(ref(db, 'users/' + uid));
  if (!snap.exists()) return toast('User not found', 'error');
  const p = snap.val();
  const presence = allPresence[uid] || {};
  const isOnline = presence.online === true;

  const pReviews = Object.values(allReviews || {})
    .filter(r => r.playboyId === uid)
    .sort((a, b) => b.createdAt - a.createdAt);
  const topReviews = pReviews.slice(0, 5);

  let reviewsHTML = '';
  if (pReviews.length) {
    reviewsHTML = `<div class="reviews-section">
      <div class="reviews-header">
        <strong>⭐ Reviews (${p.totalReviews || pReviews.length})</strong>
        ${p.avgRating ? `<span class="reviews-avg">${p.avgRating} avg</span>` : ''}
      </div>
      ${topReviews.map(r => `
        <div class="review-item">
          <div class="review-head">
            <span class="review-name">${escapeHtml(r.customerName || 'Anonymous')}</span>
            <span class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
          </div>
          ${r.text ? `<div class="review-text">${escapeHtml(r.text)}</div>` : ''}
          <div class="review-date">${new Date(r.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
        </div>
      `).join('')}
    </div>`;
  }

  document.getElementById('modalContent').innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-profile-head">
      <div class="modal-avatar">
        ${avatarHTML(p)}
        ${isOnline ? '<div class="online-dot"></div>' : ''}
      </div>
      <div class="modal-name">
        ${escapeHtml(p.name)} <span style="color:var(--success)">✓</span>
        ${isOnline ? '<span style="color:var(--online);font-size:11px">● ONLINE</span>' : ''}
      </div>
      <div class="modal-rate">₹${p.rate}/hour</div>
      ${p.avgRating > 0 ? `<div class="modal-rating-line">⭐ ${p.avgRating} · ${p.totalReviews} reviews</div>` : ''}
      <div class="modal-meta">
        📍 ${escapeHtml(p.city || 'N/A')}
        ${p.age ? ` · 🎂 ${p.age} yrs` : ''}
        ${!isOnline && presence.lastSeen ? ` · ${formatLastSeen(presence.lastSeen)}` : ''}
      </div>
    </div>

    <div style="background:#000;border:1px solid var(--border);padding:14px;border-radius:10px;margin-bottom:16px;
                font-size:13px;line-height:1.5;color:var(--muted)">${escapeHtml(p.bio || 'No bio')}</div>

    ${p.services ? `<div style="margin-bottom:12px">
      <strong style="font-size:13px;color:var(--gold)">💼 Services:</strong><br>
      <span style="font-size:13px;color:var(--muted)">${escapeHtml(p.services)}</span>
    </div>` : ''}

    ${p.hours ? `<div style="margin-bottom:12px">
      <strong style="font-size:13px;color:var(--gold)">🕐 Available:</strong><br>
      <span style="font-size:13px;color:var(--muted)">${escapeHtml(p.hours)}</span>
    </div>` : ''}

    ${p.lang ? `<div style="margin-bottom:12px">
      <strong style="font-size:13px;color:var(--gold)">🗣 Languages:</strong><br>
      <span style="font-size:13px;color:var(--muted)">${escapeHtml(p.lang)}</span>
    </div>` : ''}

    ${reviewsHTML}

    <div class="form-group"><label>📅 Booking Date *</label>
      <input type="date" id="bk-date" min="${new Date().toISOString().split('T')[0]}"></div>
    <div class="form-group"><label>⏰ Hours *</label>
      <input type="number" id="bk-hours" value="2" min="1" max="24"
             oninput="updateTotal(${p.rate})"></div>
    <div class="form-group"><label>📝 Note (optional)</label>
      <textarea id="bk-note" placeholder="Any special request..."></textarea></div>

    <div style="color:var(--gold);font-weight:800;text-align:center;margin:12px 0;
                font-size:18px" id="bk-total">Total: ₹${p.rate * 2}</div>

    <button class="btn btn-primary btn-lg" id="bookBtn" onclick="bookNow('${p.uid}')">
      📅 Send Booking Request
    </button>
    <button class="btn btn-ghost btn-lg" style="margin-top:8px"
            onclick="openChatWith('${p.uid}')">💬 Chat First</button>
    <button class="btn btn-ghost btn-lg" style="margin-top:8px;background:transparent"
            onclick="closeModal()">Cancel</button>
  `;
  document.getElementById('modal').classList.add('active');
};

window.updateTotal = function(rate) {
  const h = +document.getElementById('bk-hours').value || 0;
  document.getElementById('bk-total').textContent = 'Total: ₹' + (rate * h);
};

window.bookNow = async function(pbId) {
  const btn = document.getElementById('bookBtn');
  const date = document.getElementById('bk-date').value;
  const hours = +document.getElementById('bk-hours').value;
  const note = document.getElementById('bk-note').value.trim();

  if (!date) return toast('Select booking date', 'error');
  if (!hours || hours < 1) return toast('Enter valid hours', 'error');
  if (hours > 24) return toast('Max 24 hours', 'error');

  btn.disabled = true;
  btn.textContent = '⏳ Sending...';

  try {
    const pbSnap = await get(ref(db, 'users/' + pbId));
    if (!pbSnap.exists()) throw new Error('PlayBoy not found');
    const pb = pbSnap.val();

    const allBk = await get(ref(db, 'bookings'));
    if (allBk.exists()) {
      const dup = Object.values(allBk.val()).find(b =>
        b.customerId === me.uid &&
        b.playboyId === pbId &&
        b.date === date &&
        (b.status === 'pending' || b.status === 'accepted')
      );
      if (dup) throw new Error('You already have a booking on this date');
    }

    const newRef = push(ref(db, 'bookings'));
    await set(newRef, {
      bid: newRef.key,
      playboyId: pbId, playboyName: pb.name,
      customerId: me.uid, customerName: me.name,
      date, hours, note, total: pb.rate * hours,
      status: 'pending', createdAt: Date.now()
    });

    toast('✅ Booking request sent!', 'success');
    closeModal();
  } catch (e) {
    toast(e.message || 'Booking failed', 'error');
    btn.disabled = false;
    btn.textContent = '📅 Send Booking Request';
  }
};

window.openChatWith = function(otherId) {
  window.location.href = 'chat.html?with=' + otherId;
};

(async function init() {
  await new Promise(r => setTimeout(r, 300));
  document.getElementById('loader').style.display = 'none';

  const saved = localStorage.getItem('currentUser');
  if (!saved) { window.location.replace('index.html'); return; }

  try {
    const ref_ = JSON.parse(saved);
    const snap = await get(ref(db, 'users/' + ref_.uid));
    if (!snap.exists()) {
      localStorage.removeItem('currentUser');
      window.location.replace('index.html');
      return;
    }
    me = snap.val();
    if (me.role !== 'customer') { window.location.replace('profile.html'); return; }
    if (me.status === 'blocked') {
      localStorage.removeItem('currentUser');
      window.location.replace('index.html');
      return;
    }

    setupNav();
    startRealtimeListeners();
  } catch (e) {
    window.location.replace('index.html');
  }
})();
</script>
</body>
</html>
