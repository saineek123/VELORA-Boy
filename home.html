<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#ff2e63">
<title>Home — PlayBoy Rentals</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#ff2e63; --primary-dark:#c70039; --gold:#ffd700;
  --bg:#0f0f1a; --bg2:#1a1a2e; --bg3:#2a2a3e; --border:#2a2a3e;
  --text:#fff; --muted:#888; --success:#00b894; --danger:#e74c3c;
  --warning:#f39c12; --online:#25d366; --radius:14px;
}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.5;
  padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.loader{position:fixed;inset:0;background:var(--bg);z-index:9999;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.spinner{width:44px;height:44px;border:4px solid var(--bg3);border-top-color:var(--primary);
  border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader p{color:var(--muted);font-size:13px}

.topnav{position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
  padding-top:calc(14px + env(safe-area-inset-top))}
.topnav h1{font-size:18px;font-weight:700}
.topnav h1 span{color:var(--gold)}
.topnav button{background:rgba(255,255,255,.2);border:none;color:#fff;
  width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}

.container{max-width:640px;margin:0 auto;padding:20px 16px}
.section-title{font-size:18px;font-weight:700;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.section-title span{color:var(--primary)}
.online-count{font-size:11px;color:var(--online);font-weight:600;
  background:rgba(37,211,102,.15);padding:3px 10px;border-radius:12px}

/* SEARCH & FILTER */
.search-bar{margin-bottom:12px;position:relative}
.search-bar input{padding-left:44px;width:100%;padding:12px 16px 12px 44px;
  background:var(--bg2);border:1.5px solid var(--border);color:#fff;
  border-radius:12px;font-size:15px;font-family:inherit;transition:.2s}
.search-bar input:focus{outline:none;border-color:var(--primary)}
.search-bar::before{content:'🔍';position:absolute;left:16px;top:50%;
  transform:translateY(-50%);font-size:16px;pointer-events:none}

.filter-bar{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;
  scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;background:var(--bg2);border:1px solid var(--border);color:#fff;
  border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
  font-family:inherit;transition:.2s;display:flex;align-items:center;gap:4px}
.chip:active{transform:scale(.95)}
.chip.active{background:var(--primary);border-color:var(--primary)}

/* PLAYBOY CARD */
.pb-card{margin-bottom:14px;padding:16px;background:var(--bg2);border-radius:14px;
  border:1px solid var(--border);display:flex;gap:14px;cursor:pointer;transition:.2s}
.pb-card:hover{border-color:rgba(255,46,99,.4)}
.pb-card:active{transform:scale(.98)}

.pb-av-wrap{position:relative;flex-shrink:0}
.pb-avatar{width:70px;height:70px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  display:flex;align-items:center;justify-content:center;font-size:30px;
  border:2px solid var(--gold);overflow:hidden}
.pb-avatar img{width:100%;height:100%;object-fit:cover}
.online-dot{position:absolute;bottom:2px;right:2px;width:14px;height:14px;
  border-radius:50%;background:var(--online);border:2.5px solid var(--bg2);
  box-shadow:0 0 8px rgba(37,211,102,.6)}

.pb-info{flex:1;min-width:0}
.pb-info h3{font-size:16px;margin-bottom:4px;display:flex;align-items:center;
  gap:6px;flex-wrap:wrap}
.pb-info .rate{color:var(--gold);font-weight:700;font-size:15px;margin-bottom:3px}
.pb-info .bio{color:var(--muted);font-size:12px;margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;line-clamp:2;line-height:1.4}
.pb-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;font-size:11px;color:var(--muted)}
.pb-meta span{display:flex;align-items:center;gap:3px}

.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;
  font-weight:700;background:var(--success);color:#fff;letter-spacing:.3px}
.badge.online-badge{background:var(--online)}
.badge.new-badge{background:var(--warning);color:#000}

.empty{text-align:center;padding:60px 20px;color:#555;font-size:14px}
.empty .big{font-size:52px;display:block;margin-bottom:12px;opacity:.5}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);
  border-top:1px solid var(--border);display:flex;
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:40}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  text-decoration:none;color:var(--muted);font-size:11px;padding:6px 0;cursor:pointer}
.bottom-nav a .icon{font-size:20px}
.bottom-nav a.active{color:var(--primary)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;
  display:none;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--bg2);width:100%;max-width:480px;
  border-radius:20px 20px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));
  max-height:90vh;overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:#444;border-radius:2px;margin:0 auto 16px}
.modal h3{font-size:18px;margin-bottom:16px;color:var(--primary)}

.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input,textarea{width:100%;padding:13px 16px;background:var(--bg);border:1.5px solid var(--border);
  color:#fff;border-radius:10px;font-size:15px;font-family:inherit;transition:.2s}
input:focus,textarea:focus{outline:none;border-color:var(--primary)}
textarea{resize:vertical;min-height:70px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border:none;border-radius:10px;cursor:pointer;
  font-size:15px;font-weight:600;transition:all .2s;text-decoration:none;
  width:100%;font-family:inherit;color:#fff}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  box-shadow:0 4px 20px rgba(255,46,99,.35)}
.btn-ghost{background:var(--bg3);color:#fff}
.btn-lg{padding:15px 24px;font-size:16px}

/* MODAL PROFILE HEADER */
.modal-profile-head{text-align:center;margin-bottom:16px}
.modal-avatar{width:90px;height:90px;border-radius:50%;margin:0 auto 12px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  display:flex;align-items:center;justify-content:center;font-size:40px;
  border:3px solid var(--gold);overflow:hidden;position:relative}
.modal-avatar img{width:100%;height:100%;object-fit:cover}
.modal-avatar .online-dot{width:16px;height:16px;bottom:3px;right:3px}
.modal-name{display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:18px;font-weight:700;margin-bottom:4px}
.modal-rate{color:var(--gold);font-weight:700;font-size:18px}
.modal-meta{color:var(--muted);font-size:13px;margin-top:4px}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:var(--bg3);color:#fff;padding:13px 24px;border-radius:30px;
  font-size:14px;font-weight:500;z-index:9999;max-width:90vw;text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.4);animation:toastIn .3s;
  border:1px solid var(--border)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.toast.success{border-color:var(--success)}
.toast.error{border-color:var(--danger)}

.hidden{display:none!important}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <p>Loading...</p>
</div>

<div class="topnav">
  <h1>Play<span>Boy</span> 💋</h1>
  <button onclick="logout()">⏻</button>
</div>

<div class="container">
  <div class="section-title">
    <span>🔥 Available <span style="color:var(--primary)">Companions</span></span>
    <span class="online-count" id="onlineCount" style="display:none">0 online</span>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search by name, city..."
           oninput="applyFilters()">
  </div>

  <div class="filter-bar" id="filterBar">
    <button class="chip active" data-sort="newest" onclick="setSort(this,'newest')">
      🆕 Newest
    </button>
    <button class="chip" data-sort="rate-low" onclick="setSort(this,'rate-low')">
      💰 Rate ↑
    </button>
    <button class="chip" data-sort="rate-high" onclick="setSort(this,'rate-high')">
      💎 Rate ↓
    </button>
    <button class="chip" data-sort="online" onclick="setSort(this,'online')">
      🟢 Online First
    </button>
  </div>

  <div id="list"></div>
</div>

<div class="bottom-nav" id="nav"></div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, push, set, onValue }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDeXdXyVYPzysn55sMNkj-tXYZJzBv7VFD4".replace('Xy',''), // safety
  authDomain: "bigwin-29967.firebaseapp.com",
  databaseURL: "https://bigwin-29967-default-rtdb.firebaseio.com",
  projectId: "bigwin-29967",
  storageBucket: "bigwin-29967.firebasestorage.app",
  messagingSenderId: "628333876092",
  appId: "1:628333876092:web:8e36daac959c0f42154af9",
  measurementId: "G-654JHXWMEL"
};
// NOTE: agar upar apiKey glti se modify ho jaye, original use karo:
const firebaseConfig_ORIG = {
  apiKey: "AIzaSyDeXdYVYPzysn55sMNkj-tXYZJzBv7VFD4",
  authDomain: "bigwin-29967.firebaseapp.com",
  databaseURL: "https://bigwin-29967-default-rtdb.firebaseio.com",
  projectId: "bigwin-29967",
  storageBucket: "bigwin-29967.firebasestorage.app",
  messagingSenderId: "628333876092",
  appId: "1:628333876092:web:8e36daac959c0f42154af9",
  measurementId: "G-654JHXWMEL"
};

const app = initializeApp(firebaseConfig_ORIG);
const db = getDatabase(app);

let me = null;
let allUsers = {};        // uid -> user object
let allPresence = {};     // uid -> {online, lastSeen}
let usersUnsub = null;
let presenceUnsub = null;
let sortMode = 'newest';
let searchQuery = '';

/* ============================================================
   HELPERS
   ============================================================ */
function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function avatarHTML(user) {
  if (user.photo) return `<img src="${user.photo}">`;
  return user.role === 'playboy' ? '👨' : '👤';
}

function formatLastSeen(ts) {
  if (!ts) return 'Offline';
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return 'Offline';
}

window.logout = function() {
  if (!confirm('Logout?')) return;
  if (me) {
    try {
      import("https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js").then(({ref, update}) => {
        update(ref(db, 'presence/' + me.uid), { online: false, lastSeen: Date.now() }).catch(()=>{});
      });
    } catch {}
  }
  localStorage.removeItem('currentUser');
  window.location.href = 'index.html';
};

window.closeModal = function() { document.getElementById('modal').classList.remove('active'); };

/* ============================================================
   NAV
   ============================================================ */
function setupNav() {
  document.getElementById('nav').innerHTML = `
    <a class="active" onclick="location.href='home.html'">
      <span class="icon">🏠</span><span>Home</span></a>
    <a onclick="location.href='chat.html'">
      <span class="icon">💬</span><span>Chat</span></a>
    <a onclick="location.href='bookings.html'">
      <span class="icon">📋</span><span>Bookings</span></a>
    <a onclick="location.href='support.html'">
      <span class="icon">🛟</span><span>Support</span></a>
  `;
}

/* ============================================================
   REALTIME LISTENERS
   ============================================================ */
function startRealtimeListeners() {
  // Users listener — any change (approve, edit, delete) reflects instantly
  if (usersUnsub) usersUnsub();
  usersUnsub = onValue(ref(db, 'users'), snap => {
    allUsers = snap.exists() ? snap.val() : {};
    renderList();
  });

  // Presence listener — online status updates
  if (presenceUnsub) presenceUnsub();
  presenceUnsub = onValue(ref(db, 'presence'), snap => {
    allPresence = snap.exists() ? snap.val() : {};
    renderList();
  });
}

/* ============================================================
   FILTERS / SORT
   ============================================================ */
window.setSort = function(btn, mode) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  sortMode = mode;
  renderList();
};

window.applyFilters = function() {
  searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
  renderList();
};

/* ============================================================
   RENDER LIST
   ============================================================ */
function renderList() {
  const box = document.getElementById('list');
  if (!me) return;

  // Get all verified+active playboys
  let list = Object.values(allUsers).filter(u =>
    u.role === 'playboy' && u.status === 'active' && u.kycDone
  );

  // Search filter
  if (searchQuery) {
    list = list.filter(p =>
      (p.name || '').toLowerCase().includes(searchQuery) ||
      (p.city || '').toLowerCase().includes(searchQuery) ||
      (p.bio || '').toLowerCase().includes(searchQuery)
    );
  }

  // Online count
  const onlineCount = list.filter(p => allPresence[p.uid] && allPresence[p.uid].online).length;
  const countEl = document.getElementById('onlineCount');
  if (onlineCount > 0) {
    countEl.style.display = 'inline-block';
    countEl.textContent = onlineCount + ' online';
  } else {
    countEl.style.display = 'none';
  }

  // Sort
  list.sort((a, b) => {
    if (sortMode === 'rate-low') return (a.rate || 0) - (b.rate || 0);
    if (sortMode === 'rate-high') return (b.rate || 0) - (a.rate || 0);
    if (sortMode === 'online') {
      const aOn = allPresence[a.uid]?.online ? 1 : 0;
      const bOn = allPresence[b.uid]?.online ? 1 : 0;
      if (aOn !== bOn) return bOn - aOn;
      return (b.createdAt || 0) - (a.createdAt || 0);
    }
    // newest (default)
    return (b.createdAt || 0) - (a.createdAt || 0);
  });

  if (!list.length) {
    if (searchQuery) {
      box.innerHTML = `<div class="empty"><span class="big">🔍</span>No results for "${escapeHtml(searchQuery)}"</div>`;
    } else {
      box.innerHTML = '<div class="empty"><span class="big">😕</span>No verified companions available<br><small>Check back soon</small></div>';
    }
    return;
  }

  const now = Date.now();
  box.innerHTML = list.map(p => {
    const presence = allPresence[p.uid] || {};
    const isOnline = presence.online === true;
    const isNew = (now - (p.createdAt || 0)) < 7 * 24 * 60 * 60 * 1000; // 7 din ke andar
    const lastSeenText = !isOnline && presence.lastSeen
      ? formatLastSeen(presence.lastSeen) : '';

    return `<div class="pb-card" onclick="openCard('${p.uid}')">
      <div class="pb-av-wrap">
        <div class="pb-avatar">${avatarHTML(p)}</div>
        ${isOnline ? '<div class="online-dot"></div>' : ''}
      </div>
      <div class="pb-info">
        <h3>
          ${escapeHtml(p.name)}
          <span class="badge">✓ VERIFIED</span>
          ${isOnline ? '<span class="badge online-badge">● ONLINE</span>' : ''}
          ${isNew && !isOnline ? '<span class="badge new-badge">NEW</span>' : ''}
        </h3>
        <div class="rate">₹${p.rate}/hour</div>
        <div class="bio">${escapeHtml(p.bio || 'No bio')}</div>
        <div class="pb-meta">
          ${p.city ? `<span>📍 ${escapeHtml(p.city)}</span>` : ''}
          ${p.age ? `<span>🎂 ${p.age}</span>` : ''}
          ${lastSeenText ? `<span style="color:#666">⏱ ${lastSeenText}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ============================================================
   OPEN PROFILE MODAL
   ============================================================ */
window.openCard = async function(uid) {
  const snap = await get(ref(db, 'users/' + uid));
  if (!snap.exists()) return toast('User not found', 'error');
  const p = snap.val();
  const presence = allPresence[uid] || {};
  const isOnline = presence.online === true;

  document.getElementById('modalContent').innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-profile-head">
      <div class="modal-avatar">
        ${avatarHTML(p)}
        ${isOnline ? '<div class="online-dot"></div>' : ''}
      </div>
      <div class="modal-name">
        ${escapeHtml(p.name)} <span style="color:var(--success)">✓</span>
        ${isOnline ? '<span style="color:var(--online);font-size:11px">● ONLINE</span>' : ''}
      </div>
      <div class="modal-rate">₹${p.rate}/hour</div>
      <div class="modal-meta">
        📍 ${escapeHtml(p.city || 'N/A')}
        ${p.age ? ` · 🎂 ${p.age} yrs` : ''}
        ${!isOnline && presence.lastSeen ? ` · ${formatLastSeen(presence.lastSeen)}` : ''}
      </div>
    </div>

    <div style="background:var(--bg3);padding:14px;border-radius:10px;margin-bottom:16px;
                font-size:13px;line-height:1.5">${escapeHtml(p.bio || 'No bio')}</div>

    ${p.services ? `<div style="margin-bottom:12px">
      <strong style="font-size:13px">💼 Services:</strong><br>
      <span style="font-size:13px;color:var(--muted)">${escapeHtml(p.services)}</span>
    </div>` : ''}

    ${p.hours ? `<div style="margin-bottom:12px">
      <strong style="font-size:13px">🕐 Available:</strong><br>
      <span style="font-size:13px;color:var(--muted)">${escapeHtml(p.hours)}</span>
    </div>` : ''}

    ${p.lang ? `<div style="margin-bottom:12px">
      <strong style="font-size:13px">🗣 Languages:</strong><br>
      <span style="font-size:13px;color:var(--muted)">${escapeHtml(p.lang)}</span>
    </div>` : ''}

    <div class="form-group"><label>📅 Booking Date *</label>
      <input type="date" id="bk-date" min="${new Date().toISOString().split('T')[0]}"></div>
    <div class="form-group"><label>⏰ Hours *</label>
      <input type="number" id="bk-hours" value="2" min="1" max="24"
             oninput="updateTotal(${p.rate})"></div>
    <div class="form-group"><label>📝 Note (optional)</label>
      <textarea id="bk-note" placeholder="Any special request..."></textarea></div>

    <div style="color:var(--gold);font-weight:700;text-align:center;margin:12px 0;
                font-size:18px" id="bk-total">Total: ₹${p.rate * 2}</div>

    <button class="btn btn-primary btn-lg" id="bookBtn" onclick="bookNow('${p.uid}')">
      📅 Send Booking Request
    </button>
    <button class="btn btn-ghost btn-lg" style="margin-top:8px"
            onclick="openChatWith('${p.uid}')">💬 Chat First</button>
    <button class="btn btn-ghost btn-lg" style="margin-top:8px;background:transparent"
            onclick="closeModal()">Cancel</button>
  `;
  document.getElementById('modal').classList.add('active');
};

window.updateTotal = function(rate) {
  const h = +document.getElementById('bk-hours').value || 0;
  document.getElementById('bk-total').textContent = 'Total: ₹' + (rate * h);
};

/* ============================================================
   BOOK NOW
   ============================================================ */
window.bookNow = async function(pbId) {
  const btn = document.getElementById('bookBtn');
  const date = document.getElementById('bk-date').value;
  const hours = +document.getElementById('bk-hours').value;
  const note = document.getElementById('bk-note').value.trim();

  if (!date) return toast('Select booking date', 'error');
  if (!hours || hours < 1) return toast('Enter valid hours', 'error');
  if (hours > 24) return toast('Max 24 hours', 'error');

  btn.disabled = true;
  btn.textContent = '⏳ Sending...';

  try {
    const pbSnap = await get(ref(db, 'users/' + pbId));
    if (!pbSnap.exists()) throw new Error('PlayBoy not found');
    const pb = pbSnap.val();

    // Check duplicate booking (same playboy + same date, still pending)
    const allBk = await get(ref(db, 'bookings'));
    if (allBk.exists()) {
      const dup = Object.values(allBk.val()).find(b =>
        b.customerId === me.uid &&
        b.playboyId === pbId &&
        b.date === date &&
        (b.status === 'pending' || b.status === 'accepted')
      );
      if (dup) throw new Error('You already have a booking on this date');
    }

    const newRef = push(ref(db, 'bookings'));
    await set(newRef, {
      bid: newRef.key,
      playboyId: pbId, playboyName: pb.name,
      customerId: me.uid, customerName: me.name,
      date, hours, note, total: pb.rate * hours,
      status: 'pending', createdAt: Date.now()
    });

    toast('✅ Booking request sent!', 'success');
    closeModal();
  } catch (e) {
    toast(e.message || 'Booking failed', 'error');
    btn.disabled = false;
    btn.textContent = '📅 Send Booking Request';
  }
};

window.openChatWith = function(otherId) {
  window.location.href = 'chat.html?with=' + otherId;
};

/* ============================================================
   INIT
   ============================================================ */
(async function init() {
  await new Promise(r => setTimeout(r, 300));
  document.getElementById('loader').style.display = 'none';

  const saved = localStorage.getItem('currentUser');
  if (!saved) { window.location.href = 'index.html'; return; }

  try {
    const ref_ = JSON.parse(saved);
    const snap = await get(ref(db, 'users/' + ref_.uid));
    if (!snap.exists()) {
      localStorage.removeItem('currentUser');
      window.location.href = 'index.html';
      return;
    }
    me = snap.val();
    if (me.role !== 'customer') { window.location.href = 'profile.html'; return; }
    if (me.status === 'blocked') {
      localStorage.removeItem('currentUser');
      window.location.href = 'index.html';
      return;
    }

    setupNav();
    startRealtimeListeners();
  } catch (e) {
    window.location.href = 'index.html';
  }
})();
</script>
