<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Admin — PlayBoy Rentals</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#ff2e63; --primary-dark:#c70039; --gold:#ffd700;
  --bg:#0f0f1a; --bg2:#1a1a2e; --bg3:#2a2a3e; --border:#2a2a3e;
  --text:#fff; --muted:#888; --success:#00b894; --danger:#e74c3c;
  --warning:#f39c12; --info:#3498db;
}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.5}
.loader{position:fixed;inset:0;background:var(--bg);z-index:9999;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.spinner{width:44px;height:44px;border:4px solid var(--bg3);border-top-color:var(--primary);
  border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader p{color:var(--muted);font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border:none;border-radius:10px;cursor:pointer;
  font-size:15px;font-weight:600;transition:all .2s;width:100%;font-family:inherit;color:#fff}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  box-shadow:0 4px 20px rgba(255,46,99,.35)}
.btn-ghost{background:var(--bg3);color:#fff}
.btn-danger{background:var(--danger)}
.btn-success{background:var(--success)}
.btn-warning{background:var(--warning);color:#000}
.btn-info{background:var(--info)}
.btn-lg{padding:15px 24px;font-size:16px}
.btn-sm{padding:8px 14px;font-size:13px;width:auto}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{width:100%;max-width:400px;background:var(--bg2);border:1px solid var(--border);
  border-radius:20px;padding:32px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-icon{font-size:60px;text-align:center;margin-bottom:12px}
.login-box h1{text-align:center;font-size:24px;margin-bottom:6px}
.login-box p{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}

.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
input,textarea{width:100%;padding:14px 16px;background:var(--bg);
  border:1.5px solid var(--border);color:#fff;border-radius:10px;font-size:15px;
  font-family:inherit;transition:border-color .2s;appearance:none}
input:focus,textarea:focus{outline:none;border-color:var(--primary)}
input::placeholder,textarea::placeholder{color:#555}
textarea{resize:vertical;min-height:80px}

.admin-header{position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,#1a0a1e,#2a0a1e);
  border-bottom:2px solid var(--primary);
  padding:16px 20px;display:flex;align-items:center;justify-content:space-between;
  padding-top:calc(16px + env(safe-area-inset-top))}
.admin-header h1{font-size:16px;font-weight:700}
.admin-header h1 span{color:var(--primary)}
.admin-header .badge-admin{background:var(--primary);color:#fff;font-size:10px;
  padding:3px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}
.admin-header button{background:rgba(255,255,255,.1);border:1px solid var(--border);
  color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;
  font-family:inherit;font-weight:600}

.container{max-width:1000px;margin:0 auto;padding:20px 16px 60px}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
@media(min-width:600px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;
  padding:18px 16px;text-align:center}
.stat-card .num{font-size:26px;font-weight:800;color:var(--primary);line-height:1}
.stat-card .lbl{font-size:11px;color:var(--muted);margin-top:6px;
  text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat-card.warn .num{color:var(--warning)}
.stat-card.ok .num{color:var(--success)}
.stat-card.info .num{color:var(--info)}

.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:20px;padding-bottom:4px;
  scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 18px;background:var(--bg2);border:1px solid var(--border);color:#fff;
  border-radius:24px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  font-family:inherit;transition:.2s;display:flex;align-items:center;gap:6px}
.tab.active{background:var(--primary);border-color:var(--primary)}
.tab .count{background:rgba(0,0,0,.3);padding:1px 6px;border-radius:8px;font-size:11px}
.tab.active .count{background:rgba(255,255,255,.25)}

.search-bar{margin-bottom:16px;position:relative}
.search-bar input{padding-left:44px}
.search-bar::before{content:'🔍';position:absolute;left:16px;top:50%;transform:translateY(-50%);
  font-size:16px;pointer-events:none}

.user-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;
  padding:16px;margin-bottom:12px}
.user-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.user-av{width:56px;height:56px;border-radius:50%;background:var(--bg3);
  display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;
  overflow:hidden;border:2px solid var(--border)}
.user-av img{width:100%;height:100%;object-fit:cover}
.user-det{flex:1;min-width:0}
.user-det h4{font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.user-det p{font-size:12px;color:var(--muted);margin-top:2px}

.status-badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.status-badge.active{background:var(--success);color:#fff}
.status-badge.pending{background:var(--warning);color:#000}
.status-badge.rejected{background:var(--danger);color:#fff}
.status-badge.blocked{background:#444;color:#fff}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
@media(min-width:600px){.info-grid{grid-template-columns:1fr 1fr 1fr}}
.info-item{font-size:12px;color:var(--muted);padding:8px 10px;background:var(--bg);
  border-radius:8px}
.info-item strong{color:#fff;display:block;font-size:13px;margin-top:2px;word-break:break-word}

.kyc-section{background:var(--bg);border-radius:10px;padding:12px;margin-bottom:12px;
  border:1px solid var(--border)}
.kyc-section h5{font-size:12px;color:var(--muted);margin-bottom:8px;
  text-transform:uppercase;letter-spacing:.5px}
.kyc-photos{display:flex;gap:10px;flex-wrap:wrap}
.kyc-photo{width:100px;height:80px;object-fit:cover;border-radius:8px;
  border:1px solid var(--border);cursor:pointer;transition:.2s}
.kyc-photo:hover{border-color:var(--primary);transform:scale(1.03)}
.kyc-id-detail{font-size:11px;color:var(--muted);margin-top:8px;
  font-family:monospace;word-break:break-all}

.user-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.user-actions .btn{flex:1;min-width:110px;padding:10px;font-size:13px}

.ticket-card{background:var(--bg2);border:1px solid var(--border);border-left:4px solid var(--warning);
  border-radius:14px;padding:16px;margin-bottom:12px}
.ticket-card.replied{border-left-color:var(--success)}
.ticket-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px}
.ticket-head h4{font-size:15px}
.ticket-head .time{font-size:11px;color:var(--muted);white-space:nowrap}
.ticket-msg{background:var(--bg);padding:12px;border-radius:8px;font-size:13px;
  color:#ccc;margin-bottom:10px;line-height:1.5}
.ticket-reply{background:rgba(0,184,148,.1);border-left:3px solid var(--success);
  padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:10px}
.ticket-reply strong{color:var(--success)}
.ticket-user{font-size:11px;color:var(--muted);margin-top:8px}

.empty{text-align:center;padding:60px 20px;color:#555;font-size:14px}
.empty .big{font-size:56px;display:block;margin-bottom:12px;opacity:.4}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:var(--bg2);width:100%;max-width:600px;border-radius:16px;
  padding:20px;max-height:90vh;overflow-y:auto;border:1px solid var(--border)}
.modal h3{font-size:18px;margin-bottom:16px;color:var(--primary)}
.modal img{width:100%;border-radius:10px;margin-bottom:12px}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  background:var(--bg3);color:#fff;padding:14px 26px;border-radius:30px;
  font-size:14px;font-weight:500;z-index:9999;max-width:90vw;text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.4);animation:toastIn .3s;
  border:1px solid var(--border)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.toast.success{border-color:var(--success)}
.toast.error{border-color:var(--danger)}

.hidden{display:none!important}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <p>Loading Admin Panel...</p>
</div>

<!-- LOGIN -->
<div id="loginScreen" class="hidden">
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-icon">🛡️</div>
      <h1>Admin Access</h1>
      <p>PlayBoy Rentals · Control Panel</p>
      <div class="form-group">
        <label>Admin Username</label>
        <input type="text" id="adm-user" placeholder="admin" autocapitalize="off">
      </div>
      <div class="form-group">
        <label>Admin Password</label>
        <input type="password" id="adm-pass" placeholder="Enter password"
               onkeypress="if(event.key==='Enter')adminLogin()">
      </div>
      <button class="btn btn-primary btn-lg" id="loginBtn" onclick="adminLogin()">
        🔓 Login as Admin
      </button>
      <p style="margin-top:16px;font-size:11px;color:var(--muted);text-align:center">
        First-time default: <strong style="color:var(--primary)">admin / admin123</strong>
      </p>
    </div>
  </div>
</div>

<!-- PANEL -->
<div id="adminPanel" class="hidden">
  <div class="admin-header">
    <h1>🛡️ Admin<span class="badge-admin">PANEL</span></h1>
    <button onclick="adminLogout()">⏻ Logout</button>
  </div>
  <div class="container">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="tabs" id="tabsBar">
      <button class="tab active" data-tab="pending" onclick="switchTab(this,'pending')">
        ⏳ Pending KYC <span class="count" id="cntPending">0</span>
      </button>
      <button class="tab" data-tab="playboys" onclick="switchTab(this,'playboys')">
        👨 PlayBoys <span class="count" id="cntPb">0</span>
      </button>
      <button class="tab" data-tab="customers" onclick="switchTab(this,'customers')">
        👤 Customers <span class="count" id="cntCu">0</span>
      </button>
      <button class="tab" data-tab="tickets" onclick="switchTab(this,'tickets')">
        🛟 Tickets <span class="count" id="cntTk">0</span>
      </button>
      <button class="tab" data-tab="bookings" onclick="switchTab(this,'bookings')">
        📋 Bookings <span class="count" id="cntBk">0</span>
      </button>
    </div>
    <div class="search-bar" id="searchBar">
      <input type="text" id="searchInput" placeholder="Search by name, username, phone..."
             oninput="renderContent()">
    </div>
    <div id="content"></div>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, update, remove }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDeXdYVYPzysn55sMNkj-tXYZJzBv7VFD4",
  authDomain: "bigwin-29967.firebaseapp.com",
  databaseURL: "https://bigwin-29967-default-rtdb.firebaseio.com",
  projectId: "bigwin-29967",
  storageBucket: "bigwin-29967.firebasestorage.app",
  messagingSenderId: "628333876092",
  appId: "1:628333876092:web:8e36daac959c0f42154af9",
  measurementId: "G-654JHXWMEL"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const Admin = { tab: 'pending', users: [], tickets: [], bookings: [] };
window.Admin = Admin;

function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function avatarHTML(u) {
  if (u.photo) return `<img src="${u.photo}">`;
  return u.role === 'playboy' ? '👨' : '👤';
}

function statusBadge(s) {
  const labels = {
    active: 'Active', pending: 'KYC Pending', kyc_pending: 'KYC Pending',
    rejected: 'Rejected', blocked: 'Blocked', completed: 'Completed', accepted: 'Accepted'
  };
  const classes = {
    active: 'active', pending: 'pending', kyc_pending: 'pending',
    rejected: 'rejected', blocked: 'blocked', completed: 'active', accepted: 'active'
  };
  return `<span class="status-badge ${classes[s] || ''}">${labels[s] || s}</span>`;
}

window.closeModal = function() { document.getElementById('modal').classList.remove('active'); };

window.adminLogin = async function() {
  const u = document.getElementById('adm-user').value.trim();
  const p = document.getElementById('adm-pass').value;
  if (!u || !p) return toast('Enter credentials', 'error');

  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Checking...';
  try {
    const snap = await get(ref(db, 'admins'));
    if (!snap.exists()) {
      await update(ref(db), { admins: { master: { username: 'admin', pass: 'admin123' } } });
    }
    const admins = (await get(ref(db, 'admins'))).val();
    const ok = Object.values(admins).some(a => a.username === u && a.pass === p);
    if (!ok) throw new Error('Invalid credentials');

    sessionStorage.setItem('admin', u);
    toast('Welcome, Admin', 'success');
    showPanel();
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = '🔓 Login as Admin';
  }
};

window.adminLogout = function() {
  if (!confirm('Logout?')) return;
  sessionStorage.removeItem('admin');
  document.getElementById('adminPanel').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
};

async function showPanel() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('adminPanel').classList.remove('hidden');
  await loadData();
}

async function loadData() {
  document.getElementById('content').innerHTML =
    '<div class="empty"><div class="spinner" style="margin:0 auto 16px"></div>Loading...</div>';

  const [us, tk, bk] = await Promise.all([
    get(ref(db, 'users')),
    get(ref(db, 'tickets')),
    get(ref(db, 'bookings'))
  ]);
  Admin.users = us.exists() ? Object.values(us.val()) : [];
  Admin.tickets = tk.exists() ? Object.values(tk.val()) : [];
  Admin.bookings = bk.exists() ? Object.values(bk.val()) : [];

  updateStats();
  renderContent();
}

function updateStats() {
  const pending = Admin.users.filter(u => u.role === 'playboy' && u.status === 'kyc_pending').length;
  const active = Admin.users.filter(u => u.role === 'playboy' && u.status === 'active').length;
  const cust = Admin.users.filter(u => u.role === 'customer').length;
  const open = Admin.tickets.filter(t => !t.reply).length;

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card warn"><div class="num">${pending}</div><div class="lbl">Pending KYC</div></div>
    <div class="stat-card ok"><div class="num">${active}</div><div class="lbl">Active PlayBoys</div></div>
    <div class="stat-card info"><div class="num">${cust}</div><div class="lbl">Customers</div></div>
    <div class="stat-card"><div class="num">${open}</div><div class="lbl">Open Tickets</div></div>
  `;

  document.getElementById('cntPending').textContent = pending;
  document.getElementById('cntPb').textContent = Admin.users.filter(u => u.role === 'playboy').length;
  document.getElementById('cntCu').textContent = cust;
  document.getElementById('cntTk').textContent = Admin.tickets.length;
  document.getElementById('cntBk').textContent = Admin.bookings.length;
}

window.switchTab = function(btn, tab) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  Admin.tab = tab;
  document.getElementById('searchBar').style.display =
    (tab === 'tickets' || tab === 'bookings') ? 'none' : 'block';
  renderContent();
};

window.renderContent = function() {
  const box = document.getElementById('content');
  const q = document.getElementById('searchInput').value.trim().toLowerCase();

  if (Admin.tab === 'pending') {
    let list = Admin.users.filter(u => u.role === 'playboy' && u.status === 'kyc_pending');
    if (q) list = list.filter(u => matchUser(u, q));
    if (!list.length) { box.innerHTML = '<div class="empty"><span class="big">✓</span>No pending KYC</div>'; return; }
    box.innerHTML = list.map(u => userCard(u, true)).join('');
  } else if (Admin.tab === 'playboys') {
    let list = Admin.users.filter(u => u.role === 'playboy');
    if (q) list = list.filter(u => matchUser(u, q));
    if (!list.length) { box.innerHTML = '<div class="empty"><span class="big">👨</span>No PlayBoys</div>'; return; }
    box.innerHTML = list.map(u => userCard(u, false)).join('');
  } else if (Admin.tab === 'customers') {
    let list = Admin.users.filter(u => u.role === 'customer');
    if (q) list = list.filter(u => matchUser(u, q));
    if (!list.length) { box.innerHTML = '<div class="empty"><span class="big">👤</span>No customers</div>'; return; }
    box.innerHTML = list.map(u => userCard(u, false)).join('');
  } else if (Admin.tab === 'tickets') {
    const sorted = [...Admin.tickets].sort((a, b) => b.createdAt - a.createdAt);
    if (!sorted.length) { box.innerHTML = '<div class="empty"><span class="big">🛟</span>No tickets</div>'; return; }
    box.innerHTML = sorted.map(t => ticketCard(t)).join('');
  } else if (Admin.tab === 'bookings') {
    const sorted = [...Admin.bookings].sort((a, b) => b.createdAt - a.createdAt);
    if (!sorted.length) { box.innerHTML = '<div class="empty"><span class="big">📋</span>No bookings</div>'; return; }
    box.innerHTML = sorted.map(b => `
      <div class="user-card">
        <div class="user-head">
          <div class="user-det">
            <h4>${escapeHtml(b.playboyName)} ← ${escapeHtml(b.customerName)} ${statusBadge(b.status)}</h4>
            <p>📅 ${b.date} · ${b.hours}h · ₹${b.total}</p>
          </div>
        </div>
        ${b.note ? `<div class="info-item">📝 ${escapeHtml(b.note)}</div>` : ''}
      </div>
    `).join('');
  }
};

function matchUser(u, q) {
  return (u.name || '').toLowerCase().includes(q) ||
         (u.username || '').toLowerCase().includes(q) ||
         (u.phone || '').includes(q);
}

function userCard(u, showKyc) {
  const kycBlock = u.kyc ? `
    <div class="kyc-section">
      <h5>KYC Documents</h5>
      <div class="kyc-photos">
        ${u.kyc.idPhoto ? `<img class="kyc-photo" src="${u.kyc.idPhoto}" onclick="viewImage('${u.kyc.idPhoto}','ID Document')">` : ''}
        ${u.kyc.selfie ? `<img class="kyc-photo" src="${u.kyc.selfie}" onclick="viewImage('${u.kyc.selfie}','Selfie')">` : ''}
      </div>
      <div class="kyc-id-detail">
        📄 ${escapeHtml((u.kyc.idType || '').toUpperCase())} · ${escapeHtml(u.kyc.idNum || 'N/A')}
      </div>
    </div>` : '';

  const actions = [];
  if (u.role === 'playboy') {
    if (u.status === 'kyc_pending') {
      actions.push(`<button class="btn btn-success btn-sm" onclick="approveKyc('${u.uid}')">✓ Approve</button>`);
      actions.push(`<button class="btn btn-danger btn-sm" onclick="rejectKyc('${u.uid}')">✕ Reject</button>`);
    } else if (u.status === 'active') {
      actions.push(`<button class="btn btn-warning btn-sm" onclick="blockUser('${u.uid}')">🚫 Block</button>`);
      actions.push(`<button class="btn btn-danger btn-sm" onclick="deleteUser('${u.uid}')">🗑 Delete</button>`);
    } else {
      actions.push(`<button class="btn btn-success btn-sm" onclick="approveKyc('${u.uid}')">✓ Approve</button>`);
      actions.push(`<button class="btn btn-danger btn-sm" onclick="deleteUser('${u.uid}')">🗑 Delete</button>`);
    }
  } else {
    if (u.status === 'blocked') {
      actions.push(`<button class="btn btn-success btn-sm" onclick="unblockUser('${u.uid}')">✓ Unblock</button>`);
    } else {
      actions.push(`<button class="btn btn-warning btn-sm" onclick="blockUser('${u.uid}')">🚫 Block</button>`);
    }
    actions.push(`<button class="btn btn-danger btn-sm" onclick="deleteUser('${u.uid}')">🗑 Delete</button>`);
  }

  return `<div class="user-card">
    <div class="user-head">
      <div class="user-av">${avatarHTML(u)}</div>
      <div class="user-det">
        <h4>${escapeHtml(u.name)} ${statusBadge(u.status)}</h4>
        <p>@${escapeHtml(u.username)} · ${u.role === 'playboy' ? 'PlayBoy' : 'Customer'}</p>
      </div>
    </div>
    <div class="info-grid">
      <div class="info-item">📞 Phone<strong>${escapeHtml(u.phone || 'N/A')}</strong></div>
      <div class="info-item">📧 Email<strong>${escapeHtml(u.email || 'N/A')}</strong></div>
      ${u.role === 'playboy' ? `
        <div class="info-item">💰 Rate<strong>₹${u.rate || 0}/hr</strong></div>
        <div class="info-item">📍 City<strong>${escapeHtml(u.city || 'N/A')}</strong></div>
        <div class="info-item">🎂 Age<strong>${u.age || 'N/A'}</strong></div>
      ` : ''}
    </div>
    ${showKyc || u.status === 'kyc_pending' ? kycBlock : ''}
    <div class="user-actions">${actions.join('')}</div>
  </div>`;
}

function ticketCard(t) {
  return `
    <div class="ticket-card ${t.reply ? 'replied' : ''}">
      <div class="ticket-head">
        <h4>${escapeHtml(t.subject)}</h4>
        <span class="time">${new Date(t.createdAt).toLocaleString()}</span>
      </div>
      <div class="ticket-msg">${escapeHtml(t.message)}</div>
      ${t.reply ? `
        <div class="ticket-reply"><strong>Replied:</strong> ${escapeHtml(t.reply)}</div>
      ` : `
        <textarea id="reply-${t.tid}" placeholder="Type your reply..." style="min-height:70px;margin-bottom:8px"></textarea>
        <button class="btn btn-success btn-sm" onclick="sendReply('${t.tid}')">📤 Reply</button>
      `}
      <div class="ticket-user">From: <strong>${escapeHtml(t.userName)}</strong> (${t.userRole})
        ${t.phone ? ` · 📞 ${escapeHtml(t.phone)}` : ''}</div>
    </div>
  `;
}

window.approveKyc = async function(uid) {
  try {
    await update(ref(db, 'users/' + uid), { status: 'active', verified: true, kycDone: true, approvedAt: Date.now() });
    toast('✅ Approved!', 'success');
    await loadData();
  } catch (e) { toast('Failed', 'error'); }
};

window.rejectKyc = async function(uid) {
  const reason = prompt('Rejection reason:', 'KYC documents not clear');
  if (reason === null) return;
  try {
    await update(ref(db, 'users/' + uid), { status: 'rejected', verified: false, rejectionReason: reason });
    toast('Rejected', 'success');
    await loadData();
  } catch (e) { toast('Failed', 'error'); }
};

window.blockUser = async function(uid) {
  if (!confirm('Block this user?')) return;
  try {
    await update(ref(db, 'users/' + uid), { status: 'blocked' });
    toast('Blocked', 'success');
    await loadData();
  } catch (e) { toast('Failed', 'error'); }
};

window.unblockUser = async function(uid) {
  try {
    await update(ref(db, 'users/' + uid), { status: 'active' });
    toast('Unblocked', 'success');
    await loadData();
  } catch (e) { toast('Failed', 'error'); }
};

window.deleteUser = async function(uid) {
  if (!confirm('⚠️ Delete user permanently?')) return;
  if (!confirm('Are you sure?')) return;
  try {
    await remove(ref(db, 'users/' + uid));
    toast('Deleted', 'success');
    await loadData();
  } catch (e) { toast('Failed', 'error'); }
};

window.sendReply = async function(tid) {
  const inp = document.getElementById('reply-' + tid);
  const reply = inp.value.trim();
  if (!reply) return toast('Write reply first', 'error');
  try {
    await update(ref(db, 'tickets/' + tid), { reply, status: 'replied', repliedAt: Date.now() });
    toast('✅ Reply sent!', 'success');
    await loadData();
  } catch (e) { toast('Failed', 'error'); }
};

window.viewImage = function(src, title) {
  document.getElementById('modalContent').innerHTML = `
    <h3>${escapeHtml(title || 'Preview')}</h3>
    <img src="${src}">
    <button class="btn btn-ghost" onclick="closeModal()">Close</button>
  `;
  document.getElementById('modal').classList.add('active');
};

(async function init() {
  await new Promise(r => setTimeout(r, 400));
  document.getElementById('loader').style.display = 'none';

  const saved = sessionStorage.getItem('admin');
  if (saved) {
    document.getElementById('loginScreen').classList.add('hidden');
    showPanel();
  } else {
    document.getElementById('loginScreen').classList.remove('hidden');
  }
})();
</script>
</body>
</html>
