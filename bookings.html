<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bookings — PlayBoy Rentals</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#ff2e63; --primary-dark:#c70039; --gold:#ffd700;
  --bg:#0f0f1a; --bg2:#1a1a2e; --bg3:#2a2a3e; --border:#2a2a3e;
  --text:#fff; --muted:#888; --success:#00b894; --danger:#e74c3c;
  --warning:#f39c12; --info:#3498db;
}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;
  padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.loader{position:fixed;inset:0;background:var(--bg);z-index:9999;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.spinner{width:44px;height:44px;border:4px solid var(--bg3);border-top-color:var(--primary);
  border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader p{color:var(--muted);font-size:13px}

.topnav{position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
  padding-top:calc(14px + env(safe-area-inset-top))}
.topnav h1{font-size:18px;font-weight:700}
.topnav h1 span{color:var(--gold)}
.topnav button{background:rgba(255,255,255,.2);border:none;color:#fff;
  width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}

.container{max-width:640px;margin:0 auto;padding:20px 16px}

.booking-card{background:var(--bg2);border-radius:14px;padding:16px;
  margin-bottom:12px;border-left:4px solid var(--primary)}
.booking-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px}
.booking-card h4{font-size:15px;margin-bottom:4px}
.booking-meta{font-size:12px;color:var(--muted);margin-bottom:3px}
.booking-meta strong{color:#fff}
.booking-price{color:var(--gold);font-weight:700;font-size:15px;margin-top:6px}

.status{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;
  text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.status.pending{background:var(--warning);color:#000}
.status.accepted{background:var(--success);color:#fff}
.status.rejected{background:var(--danger);color:#fff}
.status.completed{background:var(--info);color:#fff}

.booking-actions{display:flex;gap:8px;margin-top:12px}
.booking-actions button{flex:1;padding:11px;border:none;border-radius:8px;
  font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:#fff}
.btn-success{background:var(--success)}
.btn-danger{background:var(--danger)}
.btn-ghost{background:var(--bg3);color:#fff}
.btn-info{background:var(--info)}
.btn-rate{background:linear-gradient(135deg,var(--gold),#ff9500);color:#000;font-weight:700;
  box-shadow:0 4px 15px rgba(255,215,0,.3)}

.rated-badge{width:100%;text-align:center;padding:11px;
  background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.3);
  border-radius:8px;font-size:13px;color:var(--gold);font-weight:600}

.empty{text-align:center;padding:60px 20px;color:#555;font-size:14px}
.empty .big{font-size:52px;display:block;margin-bottom:12px;opacity:.5}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);
  border-top:1px solid var(--border);display:flex;
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:40}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  text-decoration:none;color:var(--muted);font-size:11px;padding:6px 0;cursor:pointer}
.bottom-nav a .icon{font-size:20px}
.bottom-nav a.active{color:var(--primary)}

/* REVIEW MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:var(--bg2);width:100%;max-width:420px;border-radius:16px;
  padding:24px 20px;max-height:90vh;overflow-y:auto;
  animation:popIn .3s ease;border:1px solid var(--border)}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.modal h3{font-size:18px;margin-bottom:6px;color:var(--primary);text-align:center}
.modal .subtitle{font-size:13px;color:var(--muted);text-align:center;margin-bottom:20px}

.stars-input{display:flex;justify-content:center;gap:8px;margin:20px 0 12px}
.star{font-size:40px;cursor:pointer;transition:.2s;color:#444;
  user-select:none;line-height:1;-webkit-tap-highlight-color:transparent}
.star:hover,.star.active{color:var(--gold)}
.star.pulse{animation:pulse .35s}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1.15)}}
.rating-text{text-align:center;font-size:14px;color:var(--muted);height:22px;
  font-weight:600;margin-bottom:16px}

.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
textarea{width:100%;padding:13px 16px;background:var(--bg);
  border:1.5px solid var(--border);color:#fff;border-radius:10px;font-size:15px;
  font-family:inherit;transition:.2s;resize:vertical;min-height:90px}
textarea:focus{outline:none;border-color:var(--primary)}
textarea::placeholder{color:#555}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 20px;border:none;border-radius:10px;cursor:pointer;
  font-size:15px;font-weight:600;transition:all .2s;width:100%;font-family:inherit;color:#fff}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark))}
.btn-ghost{background:var(--bg3);color:#fff}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:var(--bg3);color:#fff;padding:13px 24px;border-radius:30px;
  font-size:14px;font-weight:500;z-index:9999;max-width:90vw;text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.4);animation:toastIn .3s;
  border:1px solid var(--border)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.toast.success{border-color:var(--success)}
.toast.error{border-color:var(--danger)}

.hidden{display:none!important}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <p>Loading...</p>
</div>

<div class="topnav">
  <h1>My <span>Bookings</span></h1>
  <button onclick="logout()">⏻</button>
</div>

<div class="container">
  <div id="list"></div>
</div>

<div class="bottom-nav" id="nav"></div>

<!-- REVIEW MODAL -->
<div class="modal-overlay" id="reviewModal" onclick="if(event.target===this)closeReviewModal()">
  <div class="modal">
    <h3>⭐ Rate Your Experience</h3>
    <p class="subtitle" id="reviewSubtitle">How was your booking?</p>

    <div class="stars-input" id="starsInput">
      <span class="star" data-star="1" onclick="setRating(1)">★</span>
      <span class="star" data-star="2" onclick="setRating(2)">★</span>
      <span class="star" data-star="3" onclick="setRating(3)">★</span>
      <span class="star" data-star="4" onclick="setRating(4)">★</span>
      <span class="star" data-star="5" onclick="setRating(5)">★</span>
    </div>
    <div class="rating-text" id="ratingText">Tap a star to rate</div>

    <div class="form-group">
      <label>Write a review (optional)</label>
      <textarea id="reviewText" placeholder="Share your experience... (max 500 chars)"
                maxlength="500"></textarea>
    </div>

    <button class="btn btn-primary" id="submitReviewBtn" onclick="submitReview()" disabled>
      Submit Review
    </button>
    <button class="btn btn-ghost" style="margin-top:8px" onclick="closeReviewModal()">
      Maybe Later
    </button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, update, push, set }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDeXdYVYPzysn55sMNkj-tXYZJzBv7VFD4",
  authDomain: "bigwin-29967.firebaseapp.com",
  databaseURL: "https://bigwin-29967-default-rtdb.firebaseio.com",
  projectId: "bigwin-29967",
  storageBucket: "bigwin-29967.firebasestorage.app",
  messagingSenderId: "628333876092",
  appId: "1:628333876092:web:8e36daac959c0f42154af9",
  measurementId: "G-654JHXWMEL"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let me = null;
let currentBooking = null;
let selectedRating = 0;

const RATING_LABELS = {
  1: '😞 Poor',
  2: '😐 Fair',
  3: '🙂 Good',
  4: '😊 Very Good',
  5: '🤩 Excellent'
};

function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

window.logout = function() {
  if (!confirm('Logout?')) return;
  localStorage.removeItem('currentUser');
  window.location.href = 'index.html';
};

function setupNav() {
  const isPb = me.role === 'playboy';
  document.getElementById('nav').innerHTML = `
    <a ${!isPb ? `onclick="location.href='home.html'"` : `onclick="location.href='profile.html'"`}>
      <span class="icon">${isPb ? '👨' : '🏠'}</span>
      <span>${isPb ? 'Profile' : 'Home'}</span></a>
    <a onclick="location.href='chat.html'">
      <span class="icon">💬</span><span>Chat</span></a>
    <a class="active">
      <span class="icon">📋</span><span>Bookings</span></a>
    <a onclick="location.href='support.html'">
      <span class="icon">🛟</span><span>Support</span></a>
  `;
}

/* ============================================================
   LOAD BOOKINGS + REVIEWS
   ============================================================ */
async function loadBookings() {
  const box = document.getElementById('list');
  box.innerHTML = '<div class="empty"><div class="spinner" style="margin:0 auto 16px"></div>Loading...</div>';

  try {
    const [bkSnap, rvSnap] = await Promise.all([
      get(ref(db, 'bookings')),
      get(ref(db, 'reviews'))
    ]);

    if (!bkSnap.exists()) {
      box.innerHTML = '<div class="empty"><span class="big">📋</span>No bookings yet</div>';
      return;
    }

    let list = Object.values(bkSnap.val());
    if (me.role === 'customer') list = list.filter(b => b.customerId === me.uid);
    else list = list.filter(b => b.playboyId === me.uid);
    list.sort((a, b) => b.createdAt - a.createdAt);

    if (!list.length) {
      box.innerHTML = '<div class="empty"><span class="big">📋</span>No bookings yet</div>';
      return;
    }

    // Map of bookingId -> review (only by me)
    const reviews = rvSnap.exists() ? rvSnap.val() : {};
    const myReviews = {};
    Object.values(reviews).forEach(r => {
      if (r.customerId === me.uid) myReviews[r.bookingId] = r;
    });

    box.innerHTML = list.map(b => {
      let actions = '';

      if (me.role === 'playboy' && b.status === 'pending') {
        actions = `<div class="booking-actions">
          <button class="btn-success" onclick="updateBooking('${b.bid}','accepted')">✓ Accept</button>
          <button class="btn-danger" onclick="updateBooking('${b.bid}','rejected')">✕ Reject</button>
        </div>`;
      } else if (me.role === 'playboy' && b.status === 'accepted') {
        actions = `<div class="booking-actions">
          <button class="btn-info" onclick="updateBooking('${b.bid}','completed')">Mark Completed</button>
          <button class="btn-ghost" onclick="openChat('${b.customerId}')">💬 Chat</button>
        </div>`;
      }

      if (me.role === 'customer') {
        if (b.status === 'accepted') {
          actions = `<div class="booking-actions">
            <button class="btn-ghost" onclick="openChat('${b.playboyId}')">💬 Chat</button>
          </div>`;
        } else if (b.status === 'completed') {
          if (myReviews[b.bid]) {
            const r = myReviews[b.bid];
            actions = `<div class="booking-actions">
              <div class="rated-badge">⭐ You rated ${r.rating}/5</div>
            </div>`;
          } else {
            actions = `<div class="booking-actions">
              <button class="btn-rate" onclick="openReviewModal('${b.bid}','${b.playboyId}','${escapeHtml(b.playboyName).replace(/'/g,"\\'")}')">
                ⭐ Rate Now
              </button>
            </div>`;
          }
        }
      }

      return `<div class="booking-card">
        <div class="booking-row">
          <div>
            <h4>${escapeHtml(me.role === 'customer' ? b.playboyName : b.customerName)}</h4>
            <div class="booking-meta">📅 ${b.date} · ${b.hours}h</div>
            <div class="booking-meta">📝 ${escapeHtml(b.note || 'No note')}</div>
          </div>
          <span class="status ${b.status}">${b.status}</span>
        </div>
        <div class="booking-price">₹${b.total}</div>
        ${actions}
      </div>`;
    }).join('');
  } catch (e) {
    box.innerHTML = '<div class="empty">Failed: ' + e.message + '</div>';
  }
}

window.updateBooking = async function(bid, status) {
  try {
    await update(ref(db, 'bookings/' + bid), { status });
    toast('Booking ' + status, 'success');
    loadBookings();
  } catch (e) { toast('Failed', 'error'); }
};

window.openChat = function(otherId) {
  window.location.href = 'chat.html?with=' + otherId;
};

/* ============================================================
   REVIEW MODAL
   ============================================================ */
window.openReviewModal = function(bid, playboyId, playboyName) {
  currentBooking = { bid, playboyId };
  selectedRating = 0;
  document.getElementById('reviewSubtitle').textContent =
    `How was your booking with ${playboyName}?`;
  document.getElementById('reviewText').value = '';
  document.getElementById('submitReviewBtn').disabled = true;
  document.getElementById('submitReviewBtn').textContent = 'Submit Review';
  document.getElementById('ratingText').textContent = 'Tap a star to rate';
  updateStars();
  document.getElementById('reviewModal').classList.add('active');
};

window.closeReviewModal = function() {
  document.getElementById('reviewModal').classList.remove('active');
  currentBooking = null;
  selectedRating = 0;
};

window.setRating = function(n) {
  selectedRating = n;
  updateStars();
  document.getElementById('ratingText').textContent = RATING_LABELS[n] || '';
  document.getElementById('submitReviewBtn').disabled = false;

  const star = document.querySelector(`.star[data-star="${n}"]`);
  if (star) {
    star.classList.add('pulse');
    setTimeout(() => star.classList.remove('pulse'), 350);
  }
};

function updateStars() {
  document.querySelectorAll('.star').forEach(s => {
    const n = +s.dataset.star;
    s.classList.toggle('active', n <= selectedRating);
  });
}

/* ============================================================
   SUBMIT REVIEW
   ============================================================ */
window.submitReview = async function() {
  if (!currentBooking || !selectedRating) return;
  const btn = document.getElementById('submitReviewBtn');
  const text = document.getElementById('reviewText').value.trim();

  btn.disabled = true;
  btn.textContent = '⏳ Submitting...';

  try {
    // Duplicate check
    const allRv = await get(ref(db, 'reviews'));
    if (allRv.exists()) {
      const dup = Object.values(allRv.val()).find(r =>
        r.bookingId === currentBooking.bid && r.customerId === me.uid
      );
      if (dup) throw new Error('You already reviewed this booking');
    }

    // Save review
    const rvRef = push(ref(db, 'reviews'));
    await set(rvRef, {
      rid: rvRef.key,
      playboyId: currentBooking.playboyId,
      customerId: me.uid,
      customerName: me.name,
      bookingId: currentBooking.bid,
      rating: selectedRating,
      text: text || '',
      createdAt: Date.now()
    });

    // Mark booking reviewed
    await update(ref(db, 'bookings/' + currentBooking.bid), { reviewed: true });

    // Recalc playboy rating
    await recalcPlayboyRating(currentBooking.playboyId);

    toast('✅ Review submitted!', 'success');
    closeReviewModal();
    loadBookings();
  } catch (e) {
    toast(e.message || 'Failed to submit', 'error');
    btn.disabled = false;
    btn.textContent = 'Submit Review';
  }
};

/* ============================================================
   RECALC AVG RATING
   ============================================================ */
async function recalcPlayboyRating(playboyId) {
  try {
    const snap = await get(ref(db, 'reviews'));
    if (!snap.exists()) {
      await update(ref(db, 'users/' + playboyId), { avgRating: 0, totalReviews: 0 });
      return;
    }
    const reviews = Object.values(snap.val()).filter(r => r.playboyId === playboyId);
    if (!reviews.length) {
      await update(ref(db, 'users/' + playboyId), { avgRating: 0, totalReviews: 0 });
      return;
    }
    const sum = reviews.reduce((a, r) => a + (r.rating || 0), 0);
    const avg = Math.round((sum / reviews.length) * 10) / 10;
    await update(ref(db, 'users/' + playboyId), {
      avgRating: avg,
      totalReviews: reviews.length
    });
  } catch (e) {
    console.error('Rating recalc failed', e);
  }
}

/* ============================================================
   INIT
   ============================================================ */
(async function init() {
  await new Promise(r => setTimeout(r, 300));
  document.getElementById('loader').style.display = 'none';

  const saved = localStorage.getItem('currentUser');
  if (!saved) { window.location.href = 'index.html'; return; }

  try {
    const ref_ = JSON.parse(saved);
    const snap = await get(ref(db, 'users/' + ref_.uid));
    if (!snap.exists()) { localStorage.removeItem('currentUser'); window.location.href = 'index.html'; return; }
    me = snap.val();
    if (me.status === 'blocked') { localStorage.removeItem('currentUser'); window.location.href = 'index.html'; return; }

    setupNav();
    await loadBookings();
  } catch (e) { window.location.href = 'index.html'; }
})();
</script>
</body>
</html>
