<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Support — PlayBoy Rentals</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#ff2e63; --primary-dark:#c70039; --gold:#ffd700;
  --bg:#0f0f1a; --bg2:#1a1a2e; --bg3:#2a2a3e; --border:#2a2a3e;
  --text:#fff; --muted:#888; --success:#00b894; --danger:#e74c3c;
  --warning:#f39c12;
}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;
  padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.loader{position:fixed;inset:0;background:var(--bg);z-index:9999;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.spinner{width:44px;height:44px;border:4px solid var(--bg3);border-top-color:var(--primary);
  border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader p{color:var(--muted);font-size:13px}

.topnav{position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
  padding-top:calc(14px + env(safe-area-inset-top))}
.topnav h1{font-size:18px;font-weight:700}
.topnav h1 span{color:var(--gold)}
.topnav button{background:rgba(255,255,255,.2);border:none;color:#fff;
  width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}

.container{max-width:640px;margin:0 auto;padding:20px 16px}

.section-title{font-size:18px;font-weight:700;margin:24px 0 14px}
.section-title:first-child{margin-top:0}
.section-title span{color:var(--primary)}

.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.form-group label .req{color:var(--primary)}
input,textarea{width:100%;padding:13px 16px;background:var(--bg2);
  border:1.5px solid var(--border);color:#fff;border-radius:10px;font-size:15px;
  font-family:inherit;transition:border-color .2s}
input:focus,textarea:focus{outline:none;border-color:var(--primary)}
input::placeholder,textarea::placeholder{color:#555}
textarea{resize:vertical;min-height:100px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 20px;border:none;border-radius:10px;cursor:pointer;
  font-size:15px;font-weight:600;transition:all .2s;width:100%;font-family:inherit;color:#fff}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  box-shadow:0 4px 20px rgba(255,46,99,.35)}
.btn-lg{padding:15px 24px;font-size:16px}

.support-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:16px;margin-bottom:12px;border-left:4px solid var(--warning)}
.support-card.replied{border-left-color:var(--success)}
.support-head{display:flex;justify-content:space-between;margin-bottom:8px;gap:10px}
.support-head h4{font-size:14px}
.support-head .time{font-size:11px;color:var(--muted);white-space:nowrap}
.support-msg{background:var(--bg);padding:12px;border-radius:8px;font-size:13px;
  color:#ccc;margin-bottom:10px;line-height:1.5}
.support-reply{background:rgba(0,184,148,.1);border-left:3px solid var(--success);
  padding:10px 12px;border-radius:6px;font-size:13px}
.support-reply strong{color:var(--success);display:block;margin-bottom:4px;font-size:11px;text-transform:uppercase}
.support-waiting{font-size:11px;color:var(--warning);margin-top:8px}

.empty{text-align:center;padding:40px 20px;color:#555;font-size:14px}
.empty .big{font-size:52px;display:block;margin-bottom:12px;opacity:.5}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);
  border-top:1px solid var(--border);display:flex;
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:40}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  text-decoration:none;color:var(--muted);font-size:11px;padding:6px 0;cursor:pointer}
.bottom-nav a .icon{font-size:20px}
.bottom-nav a.active{color:var(--primary)}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:var(--bg3);color:#fff;padding:13px 24px;border-radius:30px;
  font-size:14px;font-weight:500;z-index:9999;max-width:90vw;text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.4);animation:toastIn .3s;
  border:1px solid var(--border)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.toast.success{border-color:var(--success)}
.toast.error{border-color:var(--danger)}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <p>Loading...</p>
</div>

<div class="topnav">
  <h1>Support 🛟</h1>
  <button onclick="logout()">⏻</button>
</div>

<div class="container">
  <h2 class="section-title">New <span>Ticket</span></h2>
  <div class="form-group"><label>Subject</label>
    <input type="text" id="sup-subject" placeholder="e.g. Booking issue"></div>
  <div class="form-group"><label>Message <span class="req">*</span></label>
    <textarea id="sup-msg" placeholder="Describe your issue..."></textarea></div>
  <button class="btn btn-primary btn-lg" id="supBtn" onclick="submitTicket()">📤 Send to Admin</button>

  <h2 class="section-title">My <span>Tickets</span></h2>
  <div id="list"></div>
</div>

<div class="bottom-nav" id="nav"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, push, set }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDeXdYVYPzysn55sMNkj-tXYZJzBv7VFD4",
  authDomain: "bigwin-29967.firebaseapp.com",
  databaseURL: "https://bigwin-29967-default-rtdb.firebaseio.com",
  projectId: "bigwin-29967",
  storageBucket: "bigwin-29967.firebasestorage.app",
  messagingSenderId: "628333876092",
  appId: "1:628333876092:web:8e36daac959c0f42154af9",
  measurementId: "G-654JHXWMEL"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let me = null;

function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

window.logout = function() {
  if (!confirm('Logout?')) return;
  localStorage.removeItem('currentUser');
  window.location.href = 'index.html';
};

function setupNav() {
  const isPb = me.role === 'playboy';
  document.getElementById('nav').innerHTML = `
    <a ${!isPb ? `onclick="location.href='home.html'"` : `onclick="location.href='profile.html'"`}>
      <span class="icon">${isPb ? '👨' : '🏠'}</span>
      <span>${isPb ? 'Profile' : 'Home'}</span></a>
    <a onclick="location.href='chat.html'">
      <span class="icon">💬</span><span>Chat</span></a>
    <a onclick="location.href='bookings.html'">
      <span class="icon">📋</span><span>Bookings</span></a>
    <a class="active">
      <span class="icon">🛟</span><span>Support</span></a>
  `;
}

async function loadTickets() {
  const box = document.getElementById('list');
  box.innerHTML = '<div class="empty"><div class="spinner" style="margin:0 auto 16px"></div>Loading...</div>';

  try {
    const snap = await get(ref(db, 'tickets'));
    if (!snap.exists()) {
      box.innerHTML = '<div class="empty"><span class="big">🛟</span>No tickets yet</div>';
      return;
    }
    const list = Object.values(snap.val())
      .filter(t => t.userId === me.uid)
      .sort((a, b) => b.createdAt - a.createdAt);

    if (!list.length) {
      box.innerHTML = '<div class="empty"><span class="big">🛟</span>No tickets yet</div>';
      return;
    }

    box.innerHTML = list.map(t => `
      <div class="support-card ${t.reply ? 'replied' : ''}">
        <div class="support-head">
          <h4>${escapeHtml(t.subject || 'Support')}</h4>
          <span class="time">${new Date(t.createdAt).toLocaleDateString()}</span>
        </div>
        <div class="support-msg">${escapeHtml(t.message)}</div>
        ${t.reply
          ? `<div class="support-reply"><strong>Admin Reply</strong>${escapeHtml(t.reply)}</div>`
          : '<div class="support-waiting">⏳ Waiting for admin reply</div>'}
      </div>
    `).join('');
  } catch (e) {
    box.innerHTML = '<div class="empty">Failed: ' + e.message + '</div>';
  }
}

window.submitTicket = async function() {
  const subject = document.getElementById('sup-subject').value.trim();
  const msg = document.getElementById('sup-msg').value.trim();
  if (!msg) return toast('Write your message', 'error');

  const btn = document.getElementById('supBtn');
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    const r = push(ref(db, 'tickets'));
    await set(r, {
      tid: r.key,
      userId: me.uid, userName: me.name, userRole: me.role,
      phone: me.phone || '',
      subject: subject || 'Support Request',
      message: msg, reply: '', status: 'open',
      createdAt: Date.now()
    });
    document.getElementById('sup-subject').value = '';
    document.getElementById('sup-msg').value = '';
    toast('Ticket sent! Admin will reply soon.', 'success');
    await loadTickets();
  } catch (e) { toast('Failed to send', 'error'); }
  finally { btn.disabled = false; btn.textContent = '📤 Send to Admin'; }
};

(async function init() {
  await new Promise(r => setTimeout(r, 300));
  document.getElementById('loader').style.display = 'none';

  const saved = localStorage.getItem('currentUser');
  if (!saved) { window.location.href = 'index.html'; return; }

  try {
    const ref_ = JSON.parse(saved);
    const snap = await get(ref(db, 'users/' + ref_.uid));
    if (!snap.exists()) { localStorage.removeItem('currentUser'); window.location.href = 'index.html'; return; }
    me = snap.val();
    if (me.status === 'blocked') { localStorage.removeItem('currentUser'); window.location.href = 'index.html'; return; }

    setupNav();
    await loadTickets();
  } catch (e) { window.location.href = 'index.html'; }
})();
</script>
</body>
</html>
